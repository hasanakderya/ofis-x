<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>OFIS-X | Giris-Cikis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
<header class="top-bar"><h1>OFIS-X</h1><div><span id="currentModeLabel">Mod: Personel</span><button id="btnSwitchMode">Yonetici</button></div></header>
<main>
<section id="personelScreen">
<div class="card"><input id="personelKodInput" placeholder="Kod" class="input">
<button id="btnGiris" class="btn btn-success">Giris</button>
<button id="btnCikis" class="btn btn-danger">Cikis</button><p id="lastAction"></p></div>
</section>
<section id="adminScreen" class="hidden"><button id="btnSifreDegistir">Sifre</button>
<h3>Personel</h3><button id="btnYeniPersonel">Yeni</button><table id="personelTable"><thead><tr><th>Kod</th><th>Ad</th><th>Dep</th><th>Maas</th></tr></thead><tbody></tbody></table>
</section>
</main>
<footer><span id="statusText">Hazir</span><span id="clock"></span></footer>
</div>
<script>
// Storage
window.StorageHelper={save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},load:function(k,d){try{var r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}};
// Auth
window.Auth=(function(){var k="ofisXSifre";return{sifreDegistir:function(){var y=prompt("Yeni:");if(y&&y.length>1){localStorage.setItem(k,y);alert("OK")}},sifreIste:function(cb){var g=prompt("Sifre:");if(g===localStorage.getItem(k)||g==="1234"){cb()}else{alert("Yanlis")}}}}())();
// Firebase
window.firebaseConfig={apiKey:"AIzaSyAqjiKdSFxrF3zTQrmsmtbew_2Pvp05scQ",databaseURL:"https://ofis-x-default-rtdb.firebaseio.com"};
// Personel
var PK="personelList";
function getPL(){return window.StorageHelper.load(PK,[])}
function findP(k){return getPL().find(function(p){return p.kod===k})}
function addP(kod,ad,dep,maas,tel){var l=getPL();if(findP(kod)){alert("Var!");return false}l.push({id:Date.now(),kod:kod,adSoyad:ad,departman:dep||"-",aktif:true,maas:maas||0,tel:tel||"-"});window.StorageHelper.save(PK,l);return true}
// Log
var LK="logList";
function addL(kod,tip){var p=findP(kod);if(!p)return;var e={id:Date.now(),tarih:new Date().toLocaleDateString("tr-TR"),saat:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}),personelKod:kod,personelAd:p.adSoyad,tip:tip};var l=window.StorageHelper.load(LK,[]);l.push(e);window.StorageHelper.save(LK,l)}
// App
var mode="personel";
setInterval(function(){var c=document.getElementById("clock");if(c)c.textContent=new Date().toLocaleString("tr-TR")},1000);
document.getElementById("btnSwitchMode").onclick=function(){if(mode==="personel"){window.Auth.sifreIste(function(){mode="admin";document.getElementById("personelScreen").classList.add("hidden");document.getElementById("adminScreen").classList.remove("hidden");document.getElementById("currentModeLabel").textContent="Mod: Yonetici";document.getElementById("btnSwitchMode").textContent="Personel";document.getElementById("statusText").textContent="Yonetici giris";})}}else{mode="personel";document.getElementById("personelScreen").classList.remove("hidden");document.getElementById("adminScreen").classList.add("hidden");document.getElementById("currentModeLabel").textContent="Mod: Personel";document.getElementById("btnSwitchMode").textContent="Yonetici";}};
function islem(kod,zorlu){kod=(kod||"").trim().toUpperCase();if(!kod){alert("Kod");return}var p=findP(kod);if(!p){alert("Yok: "+kod);return}if(!p.aktif){alert("Pasif");return}var tip=zorlu||"Giris";if(!zorlu){var l=window.StorageHelper.load(LK,[]);var s=l.slice().reverse().find(function(x){return x.personelKod===kod});if(s&&s.tip==="Giris")tip="Cikis"}addL(kod,tip);document.getElementById("lastAction").innerHTML="["+tip+"] "+p.adSoyad;document.getElementById("personelKodInput").value="";document.getElementById("statusText").textContent=tip}
document.getElementById("btnGiris").onclick=function(){islem(document.getElementById("personelKodInput").value,"Giris")};
document.getElementById("btnCikis").onclick=function(){islem(document.getElementById("personelKodInput").value,"Cikis")};
document.getElementById("personelKodInput").onkeydown=function(e){if(e.key==="Enter")islem(this.value)};
document.getElementById("btnYeniPersonel").onclick=function(){var k=prompt("Kod:");if(k){var a=prompt("Ad:");if(a){addP(k,a,prompt("Dep:"),prompt("Maas:"),prompt("Tel:"));document.getElementById("statusText").textContent="Eklendi"}}};
document.getElementById("btnSifreDegistir").onclick=function(){window.Auth.sifreDegistir()};
</script>
</body>
</html>
