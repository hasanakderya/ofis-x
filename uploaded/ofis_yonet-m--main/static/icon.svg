<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Clock Outer Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  <!-- Clock Center Pin -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <!-- Clock Hands (indicating check-in/time) -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="340" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
</svg>
